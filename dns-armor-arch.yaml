title: "GCP DNS Armor — Automated DNS Filtering PoC"
filename: dns-armor-arch
direction: LR

nodes:
  - {id: admin, type: onprem.client.Users, label: "Engineer\ngcloud CLI"}

clusters:
  - name: "VPC  ·  dns-armor-vpc  ·  10.10.0.0/29"
    nodes:
      - {id: vm,  type: gcp.compute.ComputeEngine, label: "Test VM\ne2-micro"}
      - {id: dns, type: gcp.network.DNS,            label: "Cloud DNS\n+ RPZ"}

  - name: "Detection"
    nodes:
      - {id: dns_armor,  type: gcp.network.DNS,          label: "Cloud DNS Armor\n(Infoblox)"}
      - {id: logging,    type: gcp.operations.Logging,   label: "Cloud Logging\n+ Log Router"}
      - {id: monitoring, type: gcp.operations.Monitoring,label: "Cloud Monitoring\nalerts → email"}

  - name: "Auto-Block Pipeline"
    nodes:
      - {id: pubsub,   type: gcp.analytics.Pubsub, label: "Pub/Sub"}
      - {id: function, type: gcp.compute.Run,       label: "Cloud Function\nblock-domain"}

edges:
  # SSH
  - {from: admin, to: vm, kind: muted, label: "SSH (IAP)"}

  # DNS query flow
  - {from: vm, to: dns,      kind: request, label: "1. dig evil.com"}
  - {from: vm, to: dns_armor,kind: request, label: "2. inspected by Armor"}

  # Detection → pipeline
  - {from: dns_armor, to: logging, kind: data,    label: "3. threat finding"}
  - {from: logging,   to: pubsub,  kind: data,    label: "4. Log Router sink"}
  - {from: pubsub,    to: function,kind: request, label: "5. trigger"}
  - {from: function,  to: dns,     kind: request, label: "6. add RPZ rule"}

  # Blocked response
  - {from: dns, to: vm, kind: data, label: "7. blocked → 0.0.0.0"}

  # Manual path
  - {from: admin, to: pubsub, kind: muted, label: "manual block/unblock"}

  # Monitoring
  - {from: logging, to: monitoring, kind: muted, label: "alerts"}
